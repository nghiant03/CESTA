train:
  model: modern_tcn
  epochs: 100
  batch_size: 64
  learning_rate: 0.003
  use_focal_loss: false
  focal_gamma: 2.0
  focal_alpha: null
  oversample: false
  oversample_ratio: 1.0
  checkpoint_monitor: val_macro_f1
  early_stopping_monitor: val_macro_f1
  features: ["temp"]
  seed: 42

data:
  window:
    window_size: 60
    train_stride: 10
    test_stride: 60
  split:
    strategy: connectivity-chronological
    train_ratio: 0.7
    val_ratio: 0.15
    test_ratio: 0.15
    tolerance: 0.05

model_kwargs:
  hidden_size: 64
  num_blocks: 5
  kernel_size: 15
  dropout: 0.16
  expansion_ratio: 3.25
  dilation_base: 1
  layer_scale_init: 0.0001
