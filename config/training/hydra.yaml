train:
  model: hydra
  epochs: 100
  batch_size: 16
  learning_rate: 0.0002
  use_focal_loss: true
  focal_gamma: 1.6
  focal_alpha: null
  oversample: true
  oversample_ratio: 0.67
  checkpoint_monitor: val_macro_f1
  early_stopping_monitor: val_macro_f1
  features: ["temp"]
  seed: 42

data:
  window:
    window_size: 60
    train_stride: 10
    test_stride: 60
  split:
    strategy: connectivity-chronological
    train_ratio: 0.7
    val_ratio: 0.15
    test_ratio: 0.15
    tolerance: 0.05

model_kwargs:
  d_model: 32
  num_layers: 3
  d_state: 128
  d_conv: 5
  expand: 2
  head_dim: 32
  num_groups: 1
  dropout: 0.13
