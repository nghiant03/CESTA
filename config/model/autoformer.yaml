train:
  model: autoformer
  epochs: 100
  batch_size: 16
  learning_rate: 0.0008
  use_focal_loss: true
  focal_gamma: 1.8
  focal_alpha: null
  oversample: true
  oversample_ratio: 0.67
  features:
  - temp
  seed: 42
data:
  window:
    window_size: 60
    train_stride: 10
    test_stride: 60
  split:
    strategy: chronological
    train_ratio: 0.8
    val_ratio: 0.1
    test_ratio: 0.1
    tolerance: 0.05
model_kwargs:
  d_model: 64
  num_layers: 4
  n_heads: 2
  d_ff: 128
  max_len: 60
  dropout: 0.005
  moving_average: 7
